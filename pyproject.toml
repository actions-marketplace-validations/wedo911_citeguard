[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citeguard-cli"
version = "0.1.2"
description = "Check a bibliography for retracted papers -- retractions, corrections, and expressions of concern via Crossref (including Retraction Watch records). CLI, Python library, MCP server, GitHub Action."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "citeguard contributors" }]
keywords = [
    "retraction",
    "retracted",
    "retracted-papers",
    "retraction-watch",
    "expression-of-concern",
    "corrigendum",
    "erratum",
    "citations",
    "citation-checker",
    "bibliography",
    "bibtex",
    "ris",
    "doi",
    "crossref",
    "research-integrity",
    "reproducibility",
    "open-science",
    "scholarly",
    "academic-writing",
    "literature-review",
    "systematic-review",
    "peer-review",
    "metascience",
    "mcp",
    "mcp-server",
    "github-action",
    "ci",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/wedo911/citeguard"
Issues = "https://github.com/wedo911/citeguard/issues"

[project.scripts]
citeguard = "citeguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
